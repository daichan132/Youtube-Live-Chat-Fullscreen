name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Verify dependency release age
        if: github.event_name == 'pull_request'
        run: node scripts/verify/check-lockfile-age.mjs --base "origin/${{ github.base_ref }}"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check generated locales
        run: yarn locales:check
      - name: Check source
        run: yarn check
      - name: Run unit tests
        run: yarn test:unit
      - name: Build Chrome extension
        run: yarn build
      - name: Build Firefox extension
        run: yarn build:firefox
      - name: Package and verify production extensions
        run: |
          yarn zip
          yarn zip:firefox
          yarn verify:package-contracts
      - name: Build testing extension
        run: yarn build:e2e
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run deterministic end-to-end tests
        run: xvfb-run --auto-servernum yarn playwright test --project=fixture --max-failures=1
