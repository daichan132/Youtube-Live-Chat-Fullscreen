name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Verify dependency release age for pull request
        if: github.event_name == 'pull_request'
        run: node scripts/verify/check-lockfile-age.mjs --base "origin/${{ github.base_ref }}"
      - name: Verify dependency release age for push
        if: github.event_name == 'push'
        run: node scripts/verify/check-lockfile-age.mjs --base "${{ github.event.before }}"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check generated locales
        run: yarn locales:check
      - name: Check source
        run: yarn check
      - name: Run tests with coverage
        run: yarn test:coverage
      - name: Run contract tests
        run: yarn test:contracts

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build Chrome extension
        run: yarn build
      - name: Build Firefox extension
        run: yarn build:firefox
      - name: Package and verify production extensions
        run: |
          yarn zip
          yarn zip:firefox
          yarn verify:package-contracts
      # Keep this before build:e2e: a later WXT mode build may refresh .output
      # before the production artifact has been captured.
      - name: Upload production Chrome ZIP for startup smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-chrome-${{ github.sha }}
          path: .output/youtube-live-chat-fullscreen-*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Build testing extension
        run: yarn build:e2e
      - name: Upload testing extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testing-extension-${{ github.sha }}
          path: .output/chrome-mv3-testing
          include-hidden-files: true
          if-no-files-found: error

  browser-contracts:
    needs: package
    # Visual baselines are generated for Playwright 1.62.1 Chromium on this
    # fixed GitHub-hosted image. Avoid ubuntu-latest image drift.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download testing extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: testing-extension-${{ github.sha }}
          path: .output/chrome-mv3-testing
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run deterministic browser contracts
        run: xvfb-run --auto-servernum yarn playwright test --project=fixture --project=visual --project=accessibility --retries=0 --max-failures=1
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-contracts-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  production-package-smoke:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download exact production Chrome ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-chrome-${{ github.sha }}
          path: .output
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Boot exact production Chrome ZIP
        run: xvfb-run --auto-servernum yarn e2e:production:chrome
