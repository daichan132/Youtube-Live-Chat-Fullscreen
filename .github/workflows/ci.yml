name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Add explicit permissions to follow security best practices
permissions:
  contents: read # CI only needs read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Verify dependency release age
        if: github.event_name == 'pull_request'
        run: node scripts/verify/check-lockfile-age.mjs --base "origin/${{ github.base_ref }}"
      - name: Install dependencies
        run: rm -rf node_modules && yarn install --immutable
      - name: Build
        run: yarn build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: rm -rf node_modules && yarn install --immutable
      - name: Lint
        run: yarn lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: rm -rf node_modules && yarn install --immutable
      - name: Run unit tests
        run: yarn test:unit
