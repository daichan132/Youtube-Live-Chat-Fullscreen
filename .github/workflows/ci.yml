name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Verify dependency release age
        if: github.event_name == 'pull_request'
        run: node scripts/verify/check-lockfile-age.mjs --base "origin/${{ github.base_ref }}"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check generated locales
        run: yarn locales:check
      - name: Check source
        run: yarn check
      - name: Run tests with coverage
        run: yarn test:coverage
      - name: Run contract tests
        run: yarn test:contracts

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build Chrome extension
        run: yarn build
      - name: Build Firefox extension
        run: yarn build:firefox
      - name: Package and verify production extensions
        run: |
          yarn zip
          yarn zip:firefox
          yarn verify:package-contracts
      - name: Build testing extension
        run: yarn build:e2e
      - name: Upload testing extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testing-extension-${{ github.sha }}
          path: .output/chrome-mv3-testing
          include-hidden-files: true
          if-no-files-found: error

  browser-contracts:
    needs: package
    # Visual baselines are generated for Playwright 1.61.1 Chromium on this
    # fixed GitHub-hosted image. Avoid ubuntu-latest image drift.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download testing extension
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: testing-extension-${{ github.sha }}
          path: .output/chrome-mv3-testing
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run deterministic browser contracts
        run: xvfb-run --auto-servernum yarn playwright test --project=fixture --project=visual --project=accessibility --retries=0 --max-failures=1
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-contracts-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
