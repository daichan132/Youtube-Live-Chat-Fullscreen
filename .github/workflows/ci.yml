name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Upload temporary source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-snapshot-${{ github.sha }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Upload temporary Yarn cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yarn-cache-${{ github.sha }}
          path: /home/runner/.yarn/berry/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Verify source and tests
        run: yarn verify

  package:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Package and verify production extensions
        run: |
          yarn zip
          yarn zip:firefox
          yarn verify:package-contracts
      # Keep this before build:e2e: a later WXT mode build may refresh .output
      # before the production artifact has been captured.
      - name: Upload production Chrome ZIP for startup smoke
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-chrome-${{ github.sha }}
          path: .output/youtube-live-chat-fullscreen-*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Build testing extension
        run: yarn build:e2e
      - name: Upload testing extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testing-extension-${{ github.sha }}
          path: .output/chrome-mv3-testing
          include-hidden-files: true
          if-no-files-found: error

  browser-contracts:
    needs: package
    # Visual baselines are generated for Playwright 1.62.1 Chromium on this
    # fixed GitHub-hosted image. Avoid ubuntu-latest image drift.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download testing extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: testing-extension-${{ github.sha }}
          path: .output/chrome-mv3-testing
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run deterministic fixture contracts
        run: xvfb-run --auto-servernum yarn playwright test --project=fixture --retries=0
      - name: Run accessibility contracts
        run: xvfb-run --auto-servernum yarn playwright test --project=accessibility --retries=0
      - name: Run visual contracts
        if: github.event_name == 'workflow_dispatch'
        run: xvfb-run --auto-servernum yarn playwright test --project=visual --retries=0 --max-failures=1
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-contracts-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  production-package-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download exact production Chrome ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-chrome-${{ github.sha }}
          path: .output
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Boot exact production Chrome ZIP
        run: xvfb-run --auto-servernum yarn e2e:production:chrome
