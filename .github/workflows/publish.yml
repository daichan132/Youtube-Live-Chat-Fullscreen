name: Publish proven release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version from an existing draft release candidate
        required: true
        type: string
      candidate_run_id:
        description: Successful Release candidate Actions run ID for this version
        required: true
        type: string
      reviewed_artifact_id:
        description: Immutable candidate artifact ID reviewed in both Chrome and Firefox
        required: true
        type: string
      browser_review_url:
        description: HTTPS link to Chrome/Firefox candidate QA record (hashes, results, untested paths)
        required: true
        type: string
      browser_review_confirmed:
        description: Both candidate ZIPs were checked on real YouTube without sending or buying; no unresolved release blockers
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-24.04
    permissions:
      # GitHub hides draft Releases from tokens without push access.
      contents: write
      actions: read
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      artifact_id: ${{ steps.proven.outputs.artifact-id }}
    steps:
      - name: Require trusted publication workflow
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publication must run from main"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION"
            exit 1
          fi
          IS_DRAFT=$(gh release view "v$RELEASE_VERSION" --json isDraft --jq .isDraft)
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "v$RELEASE_VERSION is not an unpublished draft candidate"
            exit 1
          fi
      - name: Validate successful candidate run and immutable artifact
        id: candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify/release-candidate.mjs
      - name: Download exact immutable candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: .output
      - name: Verify artifact hashes and source commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: node scripts/verify/release-proof.mjs verify --proof ".output/release-proof-v$RELEASE_VERSION.json" --expected-commit "$CANDIDATE_COMMIT" --expected-version "$RELEASE_VERSION"
      - name: Require candidate-specific browser review
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          REVIEWED_ARTIFACT_ID: ${{ inputs.reviewed_artifact_id }}
          BROWSER_REVIEW_URL: ${{ inputs.browser_review_url }}
          BROWSER_REVIEW_CONFIRMED: ${{ inputs.browser_review_confirmed }}
        run: node scripts/verify/release-browser-review.mjs
      - name: Forward the exact proven assets
        id: proven
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proven-release-assets
          path: |
            .output/youtube-live-chat-fullscreen-${{ inputs.version }}-chrome.zip
            .output/youtube-live-chat-fullscreen-${{ inputs.version }}-firefox.zip
            .output/youtube-live-chat-fullscreen-${{ inputs.version }}-sources.zip
            .output/release-proof-v${{ inputs.version }}.json
          include-hidden-files: true
          if-no-files-found: error

  publish-chrome:
    needs: validate-candidate
    runs-on: ubuntu-24.04
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.validate-candidate.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.validate-candidate.outputs.artifact_id }}
          path: .output
          digest-mismatch: error
      - name: Publish proven Chrome ZIP
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: node scripts/cws-v2-submit.mjs --zip ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-chrome.zip" --expected-version "$RELEASE_VERSION"

  publish-firefox:
    needs: validate-candidate
    runs-on: ubuntu-24.04
    environment: firefox-add-ons
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.validate-candidate.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: "yarn"
      - name: Install publishing dependencies
        run: yarn install --immutable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.validate-candidate.outputs.artifact_id }}
          path: .output
          digest-mismatch: error
      - name: Publish proven Firefox ZIP
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          yarn submit:firefox \
            --firefox-zip ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-firefox.zip" \
            --firefox-sources-zip ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-sources.zip"

  publish-github-release:
    needs: [validate-candidate, publish-chrome, publish-firefox]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.validate-candidate.outputs.artifact_id }}
          path: .output
          digest-mismatch: error
      - name: Publish the already-proven draft release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IS_DRAFT=$(gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "Release must still be an unpublished draft"
            exit 1
          fi
          gh release upload "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-chrome.zip" \
            ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-firefox.zip" \
            ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-sources.zip" \
            ".output/release-proof-v$RELEASE_VERSION.json"
          gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
