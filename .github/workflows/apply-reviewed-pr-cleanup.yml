name: Apply reviewed PR cleanup

on:
  push:
    branches:
      - improve/runtime-resilience-and-accessibility

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'daichan132' && github.event.head_commit.message == 'Apply reviewed cleanup patch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: improve/runtime-resilience-and-accessibility
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: yarn
      - name: Materialize reviewed source changes
        shell: bash
        run: |
          cat .github/ylc-reviewed-patch/part-* | base64 --decode | tar -xzf -
          rm -f __nonexistent__
          rm -f entrypoints/popup/utils/dataTransfer.ts
          rm -f entrypoints/popup/utils/dataTransfer.spec.ts
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise RuntimeError(f"Expected source not found in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              'shared/state/commands.ts',
              "if (!preset || preset.kind !== 'custom' || preset.name === name) return false",
              "if (preset?.kind !== 'custom' || preset.name === name) return false",
          )
          replace(
              'shared/runtime/createAppRuntimeLocale.spec.ts',
              "import type { PersistenceStatus, SettingsRepository } from '@/shared/settings/repository'",
              "import type { PersistenceStatus, SettingsRepository, SettingsSnapshot } from '@/shared/settings/repository'",
          )
          replace(
              'shared/runtime/createAppRuntimeLocale.spec.ts',
              'load: vi.fn(async () => ({',
              'load: vi.fn(async (): Promise<SettingsSnapshot> => ({',
          )
          replace(
              'shared/settings/originAwareStorage.spec.ts',
              'const theme = values[THEME_STORAGE_KEY] as { writerId?: string } | undefined',
              'const theme = (values as Record<string, unknown>)[THEME_STORAGE_KEY] as { writerId?: string } | undefined',
          )
          replace(
              'shared/settings/repository.ts',
              "  const hasCurrentLocale = isStoredEnvelope<unknown>(localeEnvelope) && typeof localeEnvelope.value === 'string'",
              "  const currentLocale =\n    isStoredEnvelope<unknown>(localeEnvelope) && typeof localeEnvelope.value === 'string'\n      ? resolveLanguageCode(localeEnvelope.value)\n      : null",
          )
          replace(
              'shared/settings/repository.ts',
              '      locale: hasCurrentLocale ? resolveLanguageCode(localeEnvelope.value) : fallbackLocale,',
              '      locale: currentLocale ?? fallbackLocale,',
          )
          replace(
              'shared/settings/repository.ts',
              '    compatibilityLocaleToCopy: !hasCurrentLocale && storedCompatibilityLocale !== undefined ? fallbackLocale : null,',
              '    compatibilityLocaleToCopy: currentLocale === null && storedCompatibilityLocale !== undefined ? fallbackLocale : null,',
          )

          modal_path = Path('shared/components/Modal.tsx')
          modal_text = modal_path.read_text()
          inert_pattern = re.compile(
              r"const getInertTargets = \(parent: HTMLElement, overlay: HTMLElement\) => \{.*?\n\}\n\n"
              r"const makeBackgroundInert = \(parent: HTMLElement, overlay: HTMLElement\) => \{.*?\n\}\n",
              re.S,
          )
          inert_replacement = '''const getSiblingElements = (parent: ParentNode, branch: Element) =>
            Array.from(parent.children).filter(
              (element): element is HTMLElement => element instanceof HTMLElement && element !== branch,
            )

          const getInertTargets = (overlay: HTMLElement) => {
            const targets: HTMLElement[] = []
            let branch: Element = overlay

            while (true) {
              const parentElement = branch.parentElement
              if (parentElement) {
                targets.push(...getSiblingElements(parentElement, branch))
                branch = parentElement
                continue
              }

              const root = branch.getRootNode()
              if (typeof ShadowRoot !== 'undefined' && root instanceof ShadowRoot) {
                targets.push(...getSiblingElements(root, branch))
                branch = root.host
                continue
              }

              return [...new Set(targets)]
            }
          }

          const makeBackgroundInert = (overlay: HTMLElement) => {
            const targets = getInertTargets(overlay)
            const previous = targets.map(target => ({ target, inert: target.hasAttribute('inert') }))
            for (const target of targets) target.setAttribute('inert', '')
            return () => {
              for (const entry of previous) {
                if (!entry.inert) entry.target.removeAttribute('inert')
              }
            }
          }
          '''
          modal_text, replacement_count = inert_pattern.subn(inert_replacement, modal_text, count=1)
          if replacement_count != 1:
              raise RuntimeError(f'Expected one Modal inert implementation, replaced {replacement_count}')
          modal_text = modal_text.replace('makeBackgroundInert(parent, overlay)', 'makeBackgroundInert(overlay)', 1)
          modal_path.write_text(modal_text)
          PY
      - name: Install dependencies
        run: yarn install --immutable
      - name: Format materialized source
        run: yarn fix
      - name: Commit normal source files
        shell: bash
        run: |
          rm -rf .github/ylc-reviewed-patch
          rm -f .github/workflows/apply-reviewed-pr-cleanup.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize reviewed cleanup source"
          git push origin HEAD:improve/runtime-resilience-and-accessibility
