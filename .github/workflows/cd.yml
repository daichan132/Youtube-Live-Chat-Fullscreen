name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Determine whether this version needs publishing
        id: release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid version in package.json: $VERSION"
            exit 1
          fi

          git fetch --tags --force
          SHOULD_RELEASE=true
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1 && [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            SHOULD_RELEASE=false
            echo "v$VERSION already exists; skipping automatic publishing"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual release requested for v$VERSION"
          else
            echo "v$VERSION is new; automatic publishing is required"
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  verify-and-package:
    needs: release-gate
    if: ${{ needs.release-gate.outputs.should_release == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Validate release version and ref
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from main, got: $GITHUB_REF"
            exit 1
          fi

          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid version in package.json: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check generated locales
        run: yarn locales:check
      - name: Check source
        run: yarn check
      - name: Run tests with coverage
        run: yarn test:coverage
      - name: Run contract tests
        run: yarn test:contracts
      - name: Build extensions
        run: |
          yarn build
          yarn build:firefox
      - name: Package extensions
        run: |
          yarn zip
          yarn zip:firefox
      - name: Verify production package contracts
        run: yarn verify:package-contracts
      - name: Build testing extension
        run: yarn build:e2e
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run deterministic end-to-end tests
        run: xvfb-run --auto-servernum yarn playwright test --project=fixture --project=visual --project=accessibility --retries=0 --max-failures=1
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-browser-contracts-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-packages
          path: |
            .output/youtube-live-chat-fullscreen-${{ steps.version.outputs.version }}-chrome.zip
            .output/youtube-live-chat-fullscreen-${{ steps.version.outputs.version }}-firefox.zip
            .output/youtube-live-chat-fullscreen-${{ steps.version.outputs.version }}-sources.zip
          include-hidden-files: true
          if-no-files-found: error

  prepare-release:
    needs: verify-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-packages
          path: .output
      - name: Create or verify tag
        env:
          RELEASE_VERSION: ${{ needs.verify-and-package.outputs.version }}
        run: |
          git fetch --tags --force
          TAG="v$RELEASE_VERSION"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "$TAG already points to $TAG_COMMIT, expected $GITHUB_SHA"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify-and-package.outputs.version }}
        run: |
          TAG="v$RELEASE_VERSION"
          PACKAGES=(
            ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-chrome.zip"
            ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-firefox.zip"
            ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-sources.zip"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${PACKAGES[@]}" --clobber
          else
            gh release create "$TAG" "${PACKAGES[@]}" --title "$TAG" --generate-notes --verify-tag
          fi

  publish-chrome:
    needs: [verify-and-package, prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-packages
          path: .output
      - name: Publish Chrome extension
        env:
          RELEASE_VERSION: ${{ needs.verify-and-package.outputs.version }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          node scripts/cws-v2-submit.mjs \
            --zip ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-chrome.zip" \
            --expected-version "$RELEASE_VERSION"

  publish-firefox:
    needs: [verify-and-package, prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install publishing dependencies
        run: yarn install --immutable
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-packages
          path: .output
      - name: Publish Firefox extension
        env:
          RELEASE_VERSION: ${{ needs.verify-and-package.outputs.version }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          node ./node_modules/publish-browser-extension/bin/publish-extension.mjs \
            --firefox-extension-id "youtube-live-chat-fullscreen" \
            --firefox-zip ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-firefox.zip" \
            --firefox-sources-zip ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-sources.zip"
