name: Release candidate

on:
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Validate candidate version and ref
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release candidates must run from main, got: $GITHUB_REF"
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid version in package.json: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run the local release verification command
        env:
          YLC_CANARY_REQUIRE_CLEAN: "1"
        run: xvfb-run --auto-servernum yarn verify:release
      - name: Create release proof
        run: node scripts/verify/release-proof.mjs create --commit "$GITHUB_SHA"
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-browser-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload proven candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            .output/youtube-live-chat-fullscreen-${{ steps.version.outputs.version }}-chrome.zip
            .output/youtube-live-chat-fullscreen-${{ steps.version.outputs.version }}-firefox.zip
            .output/youtube-live-chat-fullscreen-${{ steps.version.outputs.version }}-sources.zip
            .output/release-proof-v${{ steps.version.outputs.version }}.json
          include-hidden-files: true
          if-no-files-found: error

  draft-release:
    needs: verify-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download proven candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-${{ github.sha }}
          path: .output
      - name: Create or verify tag
        env:
          RELEASE_VERSION: ${{ needs.verify-and-package.outputs.version }}
        run: |
          git fetch --tags --force
          TAG="v$RELEASE_VERSION"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "$TAG already points to $TAG_COMMIT, expected $GITHUB_SHA"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release candidate $TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify-and-package.outputs.version }}
        run: |
          TAG="v$RELEASE_VERSION"
          PACKAGES=(
            ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-chrome.zip"
            ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-firefox.zip"
            ".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-sources.zip"
            ".output/release-proof-v$RELEASE_VERSION.json"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "$TAG is already published and cannot be replaced by a candidate"
              exit 1
            fi
            gh release upload "$TAG" "${PACKAGES[@]}" --clobber
          else
            gh release create "$TAG" "${PACKAGES[@]}" --draft --title "$TAG" --generate-notes --verify-tag
          fi
