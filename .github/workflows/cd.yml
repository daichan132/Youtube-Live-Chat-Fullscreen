name: CD

on:
  push:
    branches:
      - main

# Add explicit permissions to follow security best practices
permissions:
  contents: write # Need write access to create and push tags

jobs:
  create_tag:
    runs-on: ubuntu-latest
    outputs:
      tag_created: ${{ steps.check_tag.outputs.tag_created }}
      version: ${{ steps.check_tag.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Get version from package.json and create tag
        id: check_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid version in package.json: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "refs/tags/v$VERSION"
            echo "tag_created=true" >> "$GITHUB_OUTPUT"
          fi

  submit:
    needs: create_tag
    if: needs.create_tag.outputs.tag_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Zip extensions
        run: |
          yarn zip
          yarn zip:firefox
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.create_tag.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --title "v$RELEASE_VERSION" \
            --generate-notes \
            .output/*-chrome.zip \
            .output/*-firefox.zip
      - name: Submit to stores
        env:
          RELEASE_VERSION: ${{ needs.create_tag.outputs.version }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          CHROME_ZIP=".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-chrome.zip"
          FIREFOX_ZIP=".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-firefox.zip"
          SOURCES_ZIP=".output/youtube-live-chat-fullscreen-$RELEASE_VERSION-sources.zip"

          yarn submit:chrome:v2 -- \
            --zip "$CHROME_ZIP" \
            --expected-version "$RELEASE_VERSION"

          node ./node_modules/publish-browser-extension/bin/publish-extension.mjs \
            --firefox-extension-id "youtube-live-chat-fullscreen" \
            --firefox-zip "$FIREFOX_ZIP" \
            --firefox-sources-zip "$SOURCES_ZIP"
