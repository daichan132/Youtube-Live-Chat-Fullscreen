name: Real YouTube canary

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build testing extension
        run: yarn build:e2e
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Run real YouTube canary
        run: xvfb-run --auto-servernum yarn playwright test --project=canary
