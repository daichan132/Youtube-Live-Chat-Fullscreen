name: Feature request
description: Propose an improvement grounded in a viewer or contributor need
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what makes it difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds or simpler alternatives.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, or related issues when useful.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request improves fullscreen YouTube chat or this repository as a browser-extension reference.
          required: true
