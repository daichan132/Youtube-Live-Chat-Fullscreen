<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Live Chat Fullscreen — listing tile</title>
  <style>
    @font-face { font-family: Inter; font-style: normal; font-weight: 500; font-display: block; src: url('../../source/fonts/inter-500.woff2') format('woff2'); }
    * { box-sizing: border-box; }
    body { margin: 0; background: #08132d; }
    #tile { position: relative; width: 440px; height: 280px; overflow: hidden; background: #08132d; }
    .illustration { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .headline { position: absolute; left: 23px; top: 13px; margin: 0; font: 700 32px/1.06 Inter, Arial, sans-serif; letter-spacing: -1.05px; color: #fff9f3; }
    .headline span { display: block; }
    .headline span + span { color: #ff515e; }
    .icon { position: absolute; right: 24px; top: 18px; width: 48px; height: 48px; }
  </style>
</head>
<body>
  <main id="tile" aria-label="Full screen. Stay in chat.">
    <img class="illustration" src="./stream-illustration.png" alt="Illustration of a racing stream with a chat overlay and input bar." />
    <h1 class="headline"></h1>
    <img class="icon" alt="YouTube Live Chat Fullscreen app icon" />
  </main>
  <script type="module">
    const composition = window.__PROMO_COMPOSITION__ ?? await fetch('./composition.json').then(response => response.json())
    for (const line of composition.headline) {
      const span = document.createElement('span')
      span.textContent = line
      document.querySelector('.headline').append(span)
    }
    document.querySelector('.icon').src = new URL(composition.icon, location.href).href
    document.querySelector('.illustration').src = new URL(composition.illustration, location.href).href
    await document.fonts.ready
    await Promise.all([...document.images].map(image => image.decode()))
    window.__PROMO_READY__ = true
  </script>
</body>
</html>
