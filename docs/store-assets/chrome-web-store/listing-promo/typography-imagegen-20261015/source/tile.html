<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Promo concept export</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    #artwork { display: block; width: 440px; height: 280px; object-fit: contain; }
  </style>
</head>
<body>
  <img id="artwork" alt="" />
  <script type="module">
    const image = document.getElementById('artwork')
    image.src = window.__CONCEPT_IMAGE__
    image.alt = window.__CONCEPT_NAME__
    image.style.background = window.__CONCEPT_COLOR__
    await image.decode()
    window.__CONCEPT_READY__ = true
  </script>
</body>
</html>
