<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Live Chat Fullscreen — universal introduction</title>
  <style>
    @font-face {font-family:Inter;src:url('./fonts/inter-500.woff2') format('woff2');font-weight:500;font-style:normal;font-display:block}
    *{box-sizing:border-box}
    html,body{margin:0;background:#f5f2eb;font-family:Inter,Arial,sans-serif}
    #artwork{position:relative;width:1280px;height:800px;overflow:hidden;background:#f5f2eb}
    .brand{position:absolute;left:72px;top:38px;display:flex;align-items:center;gap:14px;color:#232d52;font-size:20px;font-weight:500;letter-spacing:-.45px;z-index:2}
    .brand img{width:40px;height:40px;display:block}
    .illustration{position:absolute;left:80px;top:86px;width:1120px;height:auto;display:block}
    .title{position:absolute;left:178px;top:236px;margin:0;color:#fff;font-weight:500;font-size:86px;line-height:1.13;letter-spacing:-4.5px;z-index:1}
    .title span{display:block}
    .title .chat{color:#c4c4ff}
    .youtube{display:block;margin-bottom:15px;font-size:26px;letter-spacing:-.6px;line-height:1.2;color:#fbfbff}
  </style>
</head>
<body>
  <main id="artwork" aria-label="Fullscreen video with a floating live chat panel; illustrated introduction">
    <div class="brand"><img src="../../../../public/icon/128.png" alt=""><span>YouTube Live Chat Fullscreen</span></div>
    <img class="illustration" src="./indigo-original.png" alt="Illustration of fullscreen video, floating chat, message input and send button">
    <h1 class="title"><span class="youtube">YouTube</span><span>Fullscreen.</span><span class="chat">Live Chat.</span></h1>
  </main>
</body>
</html>
